[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# macOS-only for v0.2.x; Linux/Windows can be added later by extending this list.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The Homebrew formula is published into the main streeem repo itself
# (Formula/streeem.rb). This is intentionally non-conventional — the canonical
# `brew tap` requires a separate homebrew-* repo. Users install via direct URL:
#   brew install https://raw.githubusercontent.com/3moeslam/streeem/master/Formula/streeem.rb
tap = "3moeslam/streeem"
publish-jobs = ["homebrew"]
